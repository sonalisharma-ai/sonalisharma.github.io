<!DOCTYPE html>
<html>
<head>
    <title>Contact | Sonali</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #0f172a;
            color: white;
        }

        header {
            text-align: center;
            padding: 40px;
            background: #1e293b;
        }

        h1 {
            margin: 0;
            font-size: 36px;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            padding: 40px;
        }

        .info {
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
        }

        .form-box {
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 5px;
        }

        button {
            margin-top: 15px;
            padding: 10px;
            background: #38bdf8;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0ea5e9;
        }

        @media (max-width: 800px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Contact Me</h1>
    <p>Let’s build something amazing together 🚀</p>
</header>

<div class="container">

    <!-- LEFT SIDE (INFO) -->
    <div class="info">
        <h2>📍 Location</h2>
        <p>Saskatoon, Canada</p>

        <h2>📧 Email</h2>
        <p>sonalisharma2324@gmail.com</p>

        <h2>📞 Phone</h2>
        <p>+1 250-271-0801</p>

        <h2>⏰ Hours</h2>
        <p>Mon - Fri: 9am - 6pm</p>
    </div>

    <!-- RIGHT SIDE (FORM) -->
    <div class="form-box">
        <h2>Send a Message</h2>

        <form>
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <input type="text" placeholder="Subject">
            <textarea rows="5" placeholder="Your Message"></textarea>
            <button type="submit">Send Message</button>
        </form>
    </div>

</div>

</body>
</html>

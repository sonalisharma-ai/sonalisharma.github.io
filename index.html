<!DOCTYPE html>
<html>
<head>
    <title>Sonali | AI Portfolio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #0f172a;
            color: white;
        }

        header {
            padding: 40px;
            text-align: center;
            background: #1e293b;
        }

        h1 {
            margin: 0;
            font-size: 40px;
        }

        section {
            padding: 40px;
        }

        .projects {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
        }

        .card:hover {
            transform: scale(1.05);
            transition: 0.3s;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #1e293b;
        }
    </style>
</head>

<body>

<header>
    <h1>Hi, I'm Sonali 👋</h1>
    <p>Aspiring AI Engineer | Building cool projects</p>
</header>

<section>
    <h2>🚀 My Projects</h2>
    <div class="projects">

        <div class="card">
            <h3>AI Chatbot</h3>
            <p>A chatbot built using Python and NLP.</p>
        </div>

        <div class="card">
            <h3>Data Visualization</h3>
            <p>Analyzed datasets and created visual insights.</p>
        </div>

        <div class="card">
            <h3>Future Project</h3>
            <p>Coming soon...</p>
        </div>

    </div>
</section>

<section>
    <h2>📫 Contact</h2>
    <p>Email: your@email.com</p>
</section>

<footer>
    <p>© 2026 Sonali</p>
</footer>

</body>
</html>
